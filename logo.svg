<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Back card (clone) -->
  <g filter="url(#s)" opacity="0.55">
    <rect x="220" y="68" width="210" height="280" rx="16" fill="#CBD5E1"/>
    <rect x="248" y="112" width="110" height="10" rx="5" fill="#94A3B8"/>
    <rect x="248" y="138" width="150" height="10" rx="5" fill="#94A3B8"/>
    <rect x="248" y="164" width="80" height="10" rx="5" fill="#94A3B8"/>
    <rect x="248" y="190" width="130" height="10" rx="5" fill="#94A3B8"/>
    <rect x="248" y="216" width="100" height="10" rx="5" fill="#94A3B8"/>
  </g>
  <!-- Front card (original) -->
  <g filter="url(#s)">
    <rect x="82" y="148" width="210" height="280" rx="16" fill="#F8FAFC"/>
    <rect x="110" y="192" width="110" height="10" rx="5" fill="url(#fire)"/>
    <rect x="110" y="218" width="150" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="110" y="244" width="80" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="110" y="270" width="130" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="110" y="296" width="100" height="10" rx="5" fill="#E2E8F0"/>
    <rect x="110" y="322" width="140" height="10" rx="5" fill="#E2E8F0"/>
  </g>
  <!-- Clone badge -->
  <circle cx="400" cy="390" r="50" fill="url(#fire)"/>
  <rect x="382" y="366" width="12" height="48" rx="4" fill="#fff"/>
  <rect x="406" y="366" width="12" height="48" rx="4" fill="#fff"/>
</svg>
